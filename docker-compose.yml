services:
  arkvault:
    build: .
    container_name: arkvault
    ports:
      - "3001:3001"
    volumes:
      # Persist database
      - backup-data:/app/data
      # Persist logs
      - backup-logs:/app/logs
      # Mount local backup directories (customize as needed)
      - ./backups:/backups
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_PATH=/app/data/arkvault.db
      - SESSION_SECRET=${SESSION_SECRET:-arkvault-default-secret-ensure-to-change-in-env}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FILE=/app/logs/arkvault.log
    restart: unless-stopped
    stop_grace_period: 30s

    # Resource Limits
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M

    # Log Rotation
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Security - Required for NFS mounting capabilities
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
    
    # User ID 1000 is 'node' in alpine
    user: "1000:1000"

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  backup-data:
  backup-logs:
