services:
  arkvault:
    build: .
    container_name: arkvault
    ports:
      - "3001:3001"
    volumes:
      # Persist database
      - backup-data:/app/data
      # Mount local backup directories (customize as needed)
      - ./backups:/backups
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_PATH=/app/data/arkvault.db
    restart: unless-stopped

    # Resource Limits
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M

    # Log Rotation
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Security
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  backup-data:
